# SPDX-License-Identifier: MIT
name: Sync Hearth cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-hearth-cask
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          persist-credentials: false

      - name: Update to the latest signed Hearth release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(gh api repos/adamskijow/Hearth/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"$release")"
          version="${tag#v}"
          [[ "$tag" == "v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Latest release tag is not a strict vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          }

          asset="Hearth-${version}.dmg"
          url="$(jq -r --arg name "$asset" \
            '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"
          [ -n "$url" ] && [ "$url" != "null" ] || {
            echo "Release $tag does not contain $asset" >&2
            exit 1
          }

          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$asset"
          sha="$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid sha256: $sha" >&2; exit 1; }

          current="$(ruby -ne 'puts $1 if $_ =~ /^\s*version "([^"]+)"/' Casks/hearth.rb)"
          if [ "$current" = "$version" ]; then
            echo "Hearth cask is already at $version."
            exit 0
          fi

          ruby - "$version" "$sha" <<'RUBY'
          path = "Casks/hearth.rb"
          version, sha = ARGV
          body = File.read(path)
          raise "missing version stanza" unless body.sub!(/^  version "[^"]+"$/, "  version \"#{version}\"")
          raise "missing sha256 stanza" unless body.sub!(/^  sha256 "[0-9a-f]+"$/, "  sha256 \"#{sha}\"")
          File.write(path, body)
          RUBY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hearth.rb
          git commit -m "Cask: hearth $version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
